name: Documentation Lint

on:
  push:
    branches: [main, master, next]
    paths:
      - '**/*.md'
      - '**/*.mmd'
      - '**/*.mermaid'
      - '**/csl-json/**'
      - '.markdownlint.json'
  pull_request:
    branches: [main, master, next]
    paths:
      - '**/*.md'
      - '**/*.mmd'
      - '**/*.mermaid'
      - '**/csl-json/**'
      - '.markdownlint.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    name: Lint Markdown Files
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: markdownlint '**/*.md' --config .markdownlint.json

  mermaid-validate:
    runs-on: ubuntu-latest
    name: Validate Mermaid Diagrams
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install @mermaid-js/mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Find and validate Mermaid files
        run: |
          echo "Checking Mermaid diagram files..."
          find . \( -name "*.mmd" -o -name "*.mermaid" \) | while read -r file; do
            echo "Validating: $file"
            mmdc -i "$file" -o /dev/null || exit 1
          done
          echo "✓ All Mermaid files validated"

  csl-validate:
    runs-on: ubuntu-latest
    name: Validate CSL-JSON Files
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install jsonschema

      - name: Validate CSL-JSON files
        run: |
          echo "Checking CSL-JSON reference files..."
          find . \( -name "references.json" -o -name "*.csl.json" \) | while read -r file; do
            if [ -f "$file" ]; then
              echo "Validating: $file"
              python -c "import json,sys; path=sys.argv[1]; data=json.load(open(path, encoding='utf-8')); 'references' in data or (_ for _ in ()).throw(SystemExit(f'Error: {path} missing references array')); print(f'OK {path} is valid JSON with {len(data.get(\"references\", []))} references')" "$file"
            fi
          done
          echo "✓ All CSL-JSON files validated"

  docs-standards:
    runs-on: ubuntu-latest
    name: Check Documentation Standards
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run documentation validation
        run: |
          if [ -f scripts/validate_docs.py ]; then
            python scripts/validate_docs.py
          else
            echo "⚠️  validate_docs.py not found, skipping detailed validation"
          fi

      - name: Check for documentation style guide compliance
        run: |
          echo "Checking documentation style guide compliance..."

          # Check for proper heading hierarchy
          find . -name "*.md" -not -path "./node_modules/*" -not -path "./.git/*" | while read -r file; do
            # Check that files don't start with h2 or lower
            first_heading=$(grep -m 1 "^##" "$file" | head -1)
            if [[ $first_heading =~ ^##[^#] ]]; then
              echo "⚠️  $file starts with H2 instead of H1"
            fi
          done

          echo "✓ Documentation standards check complete"

  generate-report:
    runs-on: ubuntu-latest
    name: Generate Documentation Quality Report
    needs: [markdown-lint, mermaid-validate, csl-validate, docs-standards]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate quality report
        run: |
          markdown_count=$(find . -name "*.md" -not -path "./node_modules/*" -not -path "./.git/*" | wc -l)
          mermaid_count=$(find . \( -name "*.mmd" -o -name "*.mermaid" \) | wc -l)

          cat <<EOF > docs-report.md
          # Documentation Quality Report

          Generated: $(date)

          ## Markdown Files

          - Total files: ${markdown_count}

          ## Mermaid Diagrams

          - Total files: ${mermaid_count}

          ## Status

          - Markdown Lint: ${{ needs.markdown-lint.result }}
          - Mermaid Validation: ${{ needs.mermaid-validate.result }}
          - CSL Validation: ${{ needs.csl-validate.result }}
          - Documentation Standards: ${{ needs.docs-standards.result }}

          ## Style Guides

          Documentation follows these style guides:
          - [Markdown](templates/code_styleguides/markdown.md)
          - [Mermaid](templates/code_styleguides/mermaid.md)
          - [CSL-JSON](templates/code_styleguides/csl-json.md)
          EOF

          cat docs-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-quality-report
          path: docs-report.md
