name: CI

on:
  push:
    branches: [ main, next ]
  pull_request:
    branches: [ main, next ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1.7.11

  test:
    needs: workflow-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: conductor
          environment-file: environment.yml
          create-args: >-
            python=${{ matrix.python-version }}
          cache-environment: true
          cache-downloads: true

      - name: Install Python packages
        shell: micromamba-shell {0}
        run: |
          pip install -e conductor-core -e conductor-gemini

      - name: Configure Git identity for tests
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: cd conductor-vscode && npm ci

      - name: Run Core Tests
        shell: micromamba-shell {0}
        run: |
          cd conductor-core && pytest --cov=conductor_core --cov-report=xml

      - name: Run Gemini Tests
        shell: micromamba-shell {0}
        run: |
          cd conductor-gemini && pytest --cov=conductor_gemini --cov-report=xml --cov-fail-under=99

      - name: Run VS Code Tests
        run: |
          cd conductor-vscode && npm test

      - name: Static Analysis (mypy)
        shell: micromamba-shell {0}
        run: |
          cd conductor-core && mypy --strict \
            src/conductor_core/models.py \
            src/conductor_core/prompts.py \
            src/conductor_core/validation.py
          cd ../conductor-gemini && mypy src --disable-error-code no-untyped-def

      - name: Run Smoke Test
        shell: micromamba-shell {0}
        run: |
          python scripts/smoke_test.py

      - name: Build Core
        shell: micromamba-shell {0}
        run: |
          ./scripts/build_core.sh

      - name: Build VS Code Extension
        run: |
          ./scripts/build_vsix.sh

      - name: Prepare Generated Artifacts
        shell: micromamba-shell {0}
        run: |
          python scripts/validate_conductor_assets.py --sync
          CONDUCTOR_SYNC_REPO_ONLY=1 CONDUCTOR_ANTIGRAVITY_SKILLS=1 python scripts/sync_skills.py

      - name: Validate Artifacts
        shell: micromamba-shell {0}
        run: |
          python scripts/conductor_dev.py verify --require-vsix