name: CI

on:
  push:
    branches: [ main, next ]
  pull_request:
    branches: [ main, next ]

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1.7.11

  test:
    needs: workflow-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Mamba
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          activate-environment: conductor
          mamba-version: "*"
          channels: conda-forge,defaults
          auto-activate-base: false

      - name: Install Python packages
        shell: bash -l {0}
        run: |
          pip install -e conductor-core -e conductor-gemini

      - name: Configure Git identity for tests
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: cd conductor-vscode && npm ci

      - name: Run Core Tests
        shell: bash -l {0}
        run: |
          cd conductor-core && pytest --cov=conductor_core --cov-report=xml

      - name: Run Gemini Tests
        shell: bash -l {0}
        run: |
          cd conductor-gemini && pytest --cov=conductor_gemini --cov-report=xml --cov-fail-under=99

      - name: Run VS Code Tests
        run: |
          cd conductor-vscode && npm test

      - name: Static Analysis
        shell: bash -l {0}
        run: |
          ruff check .
          ruff format --check .
          cd conductor-core && mypy --strict src
          cd ../conductor-gemini && mypy --strict src

      - name: Run Smoke Test
        shell: bash -l {0}
        run: |
          python scripts/smoke_test.py

      - name: Build Core
        shell: bash -l {0}
        run: |
          ./scripts/build_core.sh

      - name: Build VS Code Extension
        run: |
          ./scripts/build_vsix.sh

      - name: Validate Artifacts
        shell: bash -l {0}
        run: |
          python scripts/conductor_dev.py verify --require-vsix
