name: CI

on:
  push:
    branches: [ main, next ]
  pull_request:
    branches: [ main, next ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1.7.11

  test:
    needs: workflow-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Micromamba and Create Environment
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest             | tar -xvj -C "$RUNNER_TEMP" --strip-components=1 bin/micromamba
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          src = Path("environment.yml").read_text()
          rendered = re.sub(
              r"(?m)^  - python.*$",
              f"  - python=={os.environ['PYTHON_VERSION']}",
              src,
              count=1,
          )
          Path("environment-ci.yml").write_text(rendered)
          PY
          "$RUNNER_TEMP/micromamba" create -y -n conductor -f environment-ci.yml

      - name: Install Python packages
        shell: bash
        run: |
          micromamba run -n conductor pip install -e conductor-core -e conductor-gemini

      - name: Configure Git identity for tests
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: cd conductor-vscode && npm ci

      - name: Run Core Tests
        shell: bash
        run: |
          micromamba run -n conductor bash -lc "cd conductor-core && pytest --cov=conductor_core --cov-report=xml"

      - name: Run Gemini Tests
        shell: bash
        run: |
          micromamba run -n conductor bash -lc "cd conductor-gemini && pytest --cov=conductor_gemini --cov-report=xml --cov-fail-under=99"

      - name: Run VS Code Tests
        run: |
          cd conductor-vscode && npm test

      - name: Static Analysis (mypy)
        shell: bash
        run: |
          micromamba run -n conductor bash -lc "cd conductor-core && mypy --strict src/conductor_core/models.py src/conductor_core/prompts.py src/conductor_core/validation.py"
          micromamba run -n conductor bash -lc "cd conductor-gemini && mypy src --disable-error-code no-untyped-def"

      - name: Run Smoke Test
        shell: bash
        run: |
          micromamba run -n conductor python scripts/smoke_test.py

      - name: Build Core
        shell: bash
        run: |
          micromamba run -n conductor bash -lc "./scripts/build_core.sh"

      - name: Build VS Code Extension
        run: |
          ./scripts/build_vsix.sh

      - name: Prepare Generated Artifacts
        shell: bash
        run: |
          micromamba run -n conductor python scripts/validate_conductor_assets.py --sync
          micromamba run -n conductor env CONDUCTOR_SYNC_REPO_ONLY=1 CONDUCTOR_ANTIGRAVITY_SKILLS=1 python scripts/sync_skills.py

      - name: Validate Artifacts
        shell: bash
        run: |
          micromamba run -n conductor python scripts/conductor_dev.py verify --require-vsix