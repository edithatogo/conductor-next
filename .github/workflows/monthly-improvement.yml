name: Monthly Repository Improvement

on:
  schedule:
    # First Monday of every month at 09:00 UTC
    - cron: '0 9 1-7 * 1'
  workflow_dispatch:
    inputs:
      focus_area:
        description: 'Specific focus area (optional)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - security
          - prs
          - issues
      dry_run:
        description: 'Run in dry-run mode (no changes committed)'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.12'
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  collect-data:
    name: Collect Improvement Data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Collect improvement data
        run: |
          echo "🚀 Starting improvement data collection..."
          python scripts/collect_improvement_data.py --verbose
          
      - name: Upload data artifact
        uses: actions/upload-artifact@v7
        with:
          name: improvement-data
          path: .conductor/improvement-data/
          retention-days: 30
          
      - name: Upload summary
        uses: actions/upload-artifact@v7
        with:
          name: improvement-summary
          path: .conductor/improvement-data/SUMMARY.md
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: collect-data
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Python security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit pip-audit

      - name: Run security scan
        run: |
          echo "🔒 Running security scan..."
          python scripts/security_scan.py --format markdown --output .conductor/security-report.md || true
          
      - name: Upload security report
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: .conductor/security-report.md
          retention-days: 30

      - name: Upload SARIF (if created)
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('.conductor/security-results.sarif') != '' }}
        with:
          sarif_file: .conductor/security-results.sarif
        continue-on-error: true

  create-track:
    name: Create Improvement Track
    runs-on: ubuntu-latest
    needs: [collect-data, security-scan]
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download improvement data
        uses: actions/download-artifact@v8
        with:
          name: improvement-data
          path: .conductor/improvement-data/

      - name: Create improvement track
        id: create-track
        run: |
          echo "📋 Creating improvement track..."
          python scripts/create_improvement_track.py --verbose
          
          # Get the most recently created improvement track
          TRACK_DIR=$(python - <<'PY'
          from pathlib import Path

          tracks = [p for p in Path("conductor/tracks").iterdir() if p.is_dir() and p.name.startswith("improvement_")]
          if not tracks:
              raise SystemExit("No improvement track found")
          tracks.sort(key=lambda p: p.stat().st_mtime)
          print(tracks[-1].as_posix())
          PY
          )
          TRACK_NAME=$(basename "$TRACK_DIR")
          echo "track_name=$TRACK_NAME" >> "$GITHUB_OUTPUT"
          echo "track_dir=$TRACK_DIR" >> "$GITHUB_OUTPUT"

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "conductor: Create monthly improvement track ${{ steps.create-track.outputs.track_name }}"
          branch: improvement/${{ steps.create-track.outputs.track_name }}
          branch-suffix: short-commit-hash
          delete-branch: true
          title: "Monthly Repository Improvement - ${{ steps.create-track.outputs.track_name }}"
          body: |
            ## Monthly Improvement Track
            
            This track was automatically created by the monthly improvement workflow.
            
            ### Data Collection Summary
            
            - **Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            - **Focus Area:** ${{ github.event.inputs.focus_area || 'all' }}
            - **Dry Run:** ${{ github.event.inputs.dry_run || 'false' }}
            
            ### Next Steps
            
            1. Review the collected data in `.conductor/improvement-data/`
            2. Review the security report
            3. Start implementation: `/conductor:implement`
            4. Or review first: `/conductor:review ${{ steps.create-track.outputs.track_name }}`
            
            ### Automation Scripts
            
            - `scripts/collect_improvement_data.py` - Collects PRs, issues, security data
            - `scripts/security_scan.py` - Runs security audits
            - `scripts/create_improvement_track.py` - Generates prioritized track
            - `scripts/start_improvement_cycle.sh` - Orchestrates full cycle
            
            ---
            
            *This PR was automatically generated by the monthly improvement workflow.*
          assignees: ''
          reviewers: ''
          draft: false

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [create-track]
    if: always()
    permissions:
      contents: read
    
    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.create-track.result }}" == "success" ]; then
            echo "✅ Monthly improvement track created successfully!"
          elif [ "${{ needs.create-track.result }}" == "failure" ]; then
            echo "❌ Monthly improvement track creation failed!"
            exit 1
          else
            echo "⚠️  Monthly improvement workflow was skipped or cancelled"
          fi
