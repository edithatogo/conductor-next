name: Sync Upstream

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      upstream:
        description: 'Specific upstream to sync (optional)'
        required: false
        default: ''
      dry_run:
        description: 'Run in dry-run mode'
        required: false
        default: 'false'
      create_pr:
        description: 'Create PR for changes'
        required: false
        default: 'true'

env:
  PYTHON_VERSION: '3.12'

jobs:
  sync-upstream:
    name: Sync from Upstream Repositories
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub requests

      - name: Run upstream sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running upstream sync..."
          
          # Build arguments
          ARGS=(--target edithatogo/conductor-next)
          
          if [ -n "${{ github.event.inputs.upstream }}" ]; then
            ARGS+=(--upstream "${{ github.event.inputs.upstream }}")
          fi
          
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS+=(--dry-run)
          fi

          if [ "${{ github.event_name }}" == "schedule" ] || [ "${{ github.event.inputs.create_pr }}" == "true" ]; then
            ARGS+=(--create-pr)
          fi
          
          # Run sync
          python scripts/sync_upstream.py "${ARGS[@]}" --branch next
          
      - name: Upload sync state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-state
          path: .github/sync_state.json
          retention-days: 30

      - name: Generate sync report
        if: always()
        run: |
          generated_at=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          if [ -f .github/sync_state.json ]; then
            cat <<EOF > sync-report.md
          # Upstream Sync Report

          Generated: ${generated_at}

          ## Sync State

          ```json
          EOF
            cat .github/sync_state.json >> sync-report.md
            cat <<EOF >> sync-report.md
          ```

          ## Workflow Run

          - Run ID: ${{ github.run_id }}
          - Run Number: ${{ github.run_number }}
          - Trigger: ${{ github.event_name }}
          EOF
          else
            cat <<EOF > sync-report.md
          # Upstream Sync Report

          Generated: ${generated_at}

          ## Workflow Run

          - Run ID: ${{ github.run_id }}
          - Run Number: ${{ github.run_number }}
          - Trigger: ${{ github.event_name }}
          EOF
          fi
          
      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-report
          path: sync-report.md
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Upstream sync failed. Check workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
