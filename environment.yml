name: conductor
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.9
  - jinja2
  - pydantic
  - gitpython
  - click
  - pygls
  - lsprotocol
  - ruff
  - mypy
  - pytest
  - pytest-cov
  - pyyaml
  - pip
  # Gemini CLI extensions are managed by the separate Node.js CLI:
  # https://geminicli.com/docs/extensions/ (not a Python package).
  # Never install the nonexistent PyPI distribution gemini-cli-extension-api.
  - pip:
    - types-PyYAML
